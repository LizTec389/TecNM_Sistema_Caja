# ==============================================================================
# Docker Compose dedicado exclusivamente para la Base de Datos (PostgreSQL + pgAdmin)
# Uso independiente: docker compose -f docker-compose.db.yml up -d
# ==============================================================================
services:
  postgres:
    image: postgres:17-alpine
    container_name: tecnm_caja_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tecnm_caja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tecnm_caja"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tecnm_caja_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tecnm.mx
      PGADMIN_DEFAULT_PASSWORD: adminpassword123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

